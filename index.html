    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --daraz-orange: #F57224;
            --daraz-orange-dark: #d65c14;
            --bg-gray: #F5F5F5;
            --text-main: #212121;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-gray);
            color: var(--text-main);
            padding-bottom: 70px;
        }

        /* ===== PWA INSTALL BUTTON STYLES ===== */
        .pwa-install-header-btn {
            background: white;
            color: var(--daraz-orange);
            border: none;
            border-radius: 20px;
            padding: 6px 16px;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            display: none;
            align-items: center;
            gap: 8px;
            transition: all 0.3s;
            white-space: nowrap;
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
        }

        .pwa-install-header-btn.show {
            display: flex;
        }

        .pwa-install-header-btn:hover {
            background: #fff5ed;
            transform: scale(1.05);
        }

        .pwa-install-header-btn .badge-new {
            background: #e74c3c;
            color: white;
            font-size: 9px;
            padding: 2px 7px;
            border-radius: 10px;
            font-weight: 800;
            animation: pulse-badge 1.5s ease-in-out infinite;
        }

        @keyframes pulse-badge {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        /* Glass button */
        .pwa-install-header-btn-alt {
            background: rgba(255,255,255,0.15);
            color: white;
            border: 2px solid rgba(255,255,255,0.35);
            border-radius: 20px;
            padding: 5px 14px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            display: none;
            align-items: center;
            gap: 7px;
            transition: all 0.3s;
            backdrop-filter: blur(8px);
        }

        .pwa-install-header-btn-alt.show {
            display: flex;
        }

        .pwa-install-header-btn-alt:hover {
            background: rgba(255,255,255,0.25);
            border-color: rgba(255,255,255,0.6);
        }

        /* ===== FLOATING INSTALL FAB ===== */
        .pwa-fab {
            position: fixed;
            bottom: 90px;
            right: 20px;
            background: var(--daraz-orange);
            color: white;
            width: 56px;
            height: 56px;
            border-radius: 50%;
            border: none;
            box-shadow: 0 4px 20px rgba(245,114,36,0.4);
            cursor: pointer;
            font-size: 24px;
            z-index: 9998;
            display: none;
            align-items: center;
            justify-content: center;
        }

        .pwa-fab.show {
            display: flex;
        }

        /* ===== HOME INSTALL BANNER ===== */
        .install-banner-home {
            background: linear-gradient(135deg, #F57224, #FF8A5C);
            border-radius: 12px;
            padding: 20px 25px;
            margin-bottom: 20px;
            display: none;
            align-items: center;
            justify-content: space-between;
            color: white;
            box-shadow: 0 4px 15px rgba(245,114,36,0.3);
        }

        .install-banner-home.show {
            display: flex;
        }

        .install-banner-home .install-btn-main {
            background: white;
            color: var(--daraz-orange);
            border: none;
            padding: 10px 28px;
            border-radius: 25px;
            font-weight: 700;
            cursor: pointer;
        }

        /* ===== INSTALLED BADGE ===== */
        .installed-badge {
            background: #27ae60;
            color: white;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }

        /* ===== HEADER ===== */
        header {
            background-color: var(--daraz-orange);
            position: sticky;
            top: 0;
            z-index: 1000;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .header-container {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 15px;
            gap: 15px;
        }

        .logo {
            color: white;
            font-size: 26px;
            font-weight: 800;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
        }

        .search-box {
            flex: 1;
            max-width: 650px;
            display: flex;
            background: white;
            border-radius: 4px;
            overflow: hidden;
        }

        .search-box input {
            width: 100%;
            padding: 10px 14px;
            border: none;
            outline: none;
            font-size: 14px;
        }

        .search-box button {
            background: #FFE1D2;
            border: none;
            padding: 0 18px;
            color: var(--daraz-orange);
            cursor: pointer;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 10px;
            color: white;
        }

        .cart-icon {
            position: relative;
            cursor: pointer;
            font-size: 22px;
        }

        .cart-badge {
            position: absolute;
            top: -8px;
            right: -10px;
            background: white;
            color: var(--daraz-orange);
            font-weight: bold;
            font-size: 11px;
            border-radius: 50%;
            padding: 2px 6px;
        }

        .user-avatar {
            width: 32px;
            height: 32px;
            background: rgba(255,255,255,0.25);
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            font-weight: 700;
            color: white;
            text-transform: uppercase;
            margin-right: 6px;
        }

        .user-pill {
            background: rgba(255,255,255,0.2);
            padding: 4px 12px 4px 6px;
            border-radius: 20px;
            font-size: 13px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .main-container {
            max-width: 1200px;
            margin: 15px auto;
            padding: 0 15px;
        }

        .page-view { display: none; }
        .page-view.active { display: block; }

        /* ===== PRODUCTS ===== */
        .products-grid {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 12px;
            margin-bottom: 25px;
        }

        .product-card {
            background: white;
            border-radius: 6px;
            overflow: hidden;
            box-shadow: 0 2px 6px rgba(0,0,0,0.04);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .product-img {
            width: 100%;
            height: 150px;
            object-fit: cover;
            background: #f0f0f0;
        }

        .product-info { padding: 10px; }
        .product-title { 
            font-size: 13px; 
            height: 36px; 
            overflow: hidden; 
            line-height: 1.3; 
            font-weight: 600;
        }
        .product-price { 
            color: var(--daraz-orange); 
            font-size: 15px; 
            font-weight: bold; 
            margin-top: 5px; 
        }

        .add-btn {
            width: 100%;
            background: var(--daraz-orange);
            color: white;
            border: none;
            padding: 8px;
            cursor: pointer;
            font-weight: bold;
        }

        .add-btn:hover { background: var(--daraz-orange-dark); }

        /* ===== CART ===== */
        .card-panel {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.05);
            margin-bottom: 20px;
        }

        .cart-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 0;
            border-bottom: 1px solid #eee;
        }

        .cart-item-remove {
            color: #e74c3c;
            cursor: pointer;
            margin-left: 10px;
        }

        /* ===== MOBILE NAV ===== */
        .mobile-nav {
            display: none;
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: white;
            border-top: 1px solid #e0e0e0;
            padding: 8px 0;
            justify-content: space-around;
            z-index: 1000;
        }

        .mobile-nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-decoration: none;
            color: #666;
            font-size: 11px;
            cursor: pointer;
        }

        .mobile-nav-item.active { color: var(--daraz-orange); }
        .mobile-nav-item i { font-size: 18px; margin-bottom: 3px; }

        .mobile-nav { display: flex; }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 768px) {
            .products-grid { grid-template-columns: repeat(2, 1fr); }
            .pwa-install-header-btn .btn-text,
            .pwa-install-header-btn-alt .btn-text {
                display: none;
            }
            .pwa-install-header-btn { padding: 6px 10px; }
            .pwa-install-header-btn-alt { padding: 5px 10px; }
            .install-banner-home {
                flex-direction: column;
                text-align: center;
                gap: 15px;
            }
            .header-container {
                flex-wrap: wrap;
                gap: 8px;
            }
            .search-box {
                order: 3;
                flex-basis: 100%;
                max-width: 100%;
            }
        }

        @media (max-width: 480px) {
            .header-actions { gap: 6px; }
            .user-pill .user-name-text { display: none; }
            .user-pill { padding: 4px 8px; }
        }

        /* ===== TOAST ===== */
        .welcome-toast {
            position: fixed;
            top: 80px;
            right: 20px;
            background: #27ae60;
            color: white;
            padding: 14px 22px;
            border-radius: 10px;
            box-shadow: 0 6px 20px rgba(0,0,0,0.2);
            z-index: 9999;
            animation: slideInRight 0.5s ease;
        }

        @keyframes slideInRight {
            from { transform: translateX(100px); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
    </style>

<body>

    <!-- HEADER -->
    <header>
        <div class="header-container">
            <div class="logo" onclick="showPage('home-page')">
                <i class="fa-solid fa-bag-shopping"></i> DealHub
            </div>

            <div class="search-box">
                <input type="text" id="search-input" placeholder="Search..." onkeyup="handleSearch(event)">
                <button onclick="triggerSearch()"><i class="fa-solid fa-magnifying-glass"></i></button>
            </div>

            <div class="header-actions">
                <!-- BUTTON 1: White with NEW badge -->
                <button id="pwa-header-btn" class="pwa-install-header-btn" onclick="installPWA()">
                    <i class="fa-solid fa-download"></i>
                    <span class="btn-text">Install App</span>
                    <span class="badge-new">NEW</span>
                </button>

                <!-- BUTTON 2: Glass-morphism -->
                <button id="pwa-header-btn-alt" class="pwa-install-header-btn-alt" onclick="installPWA()">
                    <i class="fa-solid fa-mobile-screen-button"></i>
                    <span class="btn-text">Install</span>
                </button>

                <div class="cart-icon" onclick="showPage('cart-page')">
                    <i class="fa-solid fa-cart-shopping"></i>
                    <span class="cart-badge" id="cart-count">0</span>
                </div>
                <div class="user-pill" onclick="showPage('account-page')">
                    <span class="user-avatar" id="user-avatar-letter">👤</span>
                    <span class="user-name-text" id="header-user-text">Login</span>
                </div>
            </div>
        </div>
    </header>

    <!-- FLOATING INSTALL FAB -->
    <button id="pwa-fab" class="pwa-fab" onclick="installPWA()">
        <i class="fa-solid fa-download"></i>
    </button>

    <!-- MAIN CONTENT -->
    <div class="main-container">

        <!-- HOME PAGE -->
        <div id="home-page" class="page-view active">
            
            <!-- INSTALL BANNER -->
            <div id="install-banner-home" class="install-banner-home">
                <div>
                    <h3>🚀 Get DealHub App</h3>
                    <p>Faster shopping & offline access!</p>
                </div>
                <button class="install-btn-main" onclick="installPWA()">
                    <i class="fa-solid fa-download"></i> Install Now
                </button>
            </div>

            <h3 style="margin-bottom: 15px;">Featured Products</h3>
            <div class="products-grid" id="home-products-container"></div>
        </div>

        <!-- CART PAGE -->
        <div id="cart-page" class="page-view">
            <div class="card-panel">
                <h2>Your Cart</h2>
                <div id="cart-items-list" style="margin-top: 15px;">
                    <p style="color: #888;">Cart is empty.</p>
                </div>
                <div style="margin-top: 20px; text-align: right;">
                    <h3>Total: <span id="cart-total" style="color: var(--daraz-orange);">Rs. 0</span></h3>
                    <button onclick="checkout()" style="background: var(--daraz-orange); color: white; border: none; padding: 12px 24px; font-weight: bold; border-radius: 4px; cursor: pointer;">
                        Checkout
                    </button>
                </div>
            </div>
        </div>

        <!-- ACCOUNT PAGE -->
        <div id="account-page" class="page-view">
            <div class="card-panel">
                <h2>Account</h2>
                <p style="color:#666;">Login to add items to cart</p>
                <button onclick="login()" style="background:var(--daraz-orange);color:white;border:none;padding:10px 30px;border-radius:4px;font-weight:bold;cursor:pointer;margin-top:10px;">
                    <i class="fa-solid fa-sign-in-alt"></i> Login
                </button>
                <button onclick="logout()" style="background:#e74c3c;color:white;border:none;padding:10px 30px;border-radius:4px;font-weight:bold;cursor:pointer;margin-top:10px;display:none;" id="logout-btn">
                    <i class="fa-solid fa-sign-out-alt"></i> Logout
                </button>
            </div>
        </div>

    </div>

    <!-- MOBILE NAV -->
    <div class="mobile-nav">
        <div class="mobile-nav-item active" id="nav-home" onclick="showPage('home-page')">
            <i class="fa-solid fa-house"></i>
            <span>Home</span>
        </div>
        <div class="mobile-nav-item" id="nav-cart" onclick="showPage('cart-page')">
            <i class="fa-solid fa-cart-shopping"></i>
            <span>Cart</span>
        </div>
        <div class="mobile-nav-item" id="nav-account" onclick="showPage('account-page')">
            <i class="fa-solid fa-user"></i>
            <span>Account</span>
        </div>
    </div>

    <script>
        // ============================================================
        // PRODUCT DATA
        // ============================================================
        const products = [];
        const categories = ['Mobiles', 'Fashion', 'Electronics', 'Home', 'Beauty', 'Sports'];
        const images = [
            'https://images.unsplash.com/photo-1511707171634-5f897ff02aa9?w=300',
            'https://images.unsplash.com/photo-1521572267360-ee0c2909d518?w=300',
            'https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=300',
            'https://images.unsplash.com/photo-1546868871-7041f2a55e12?w=300',
            'https://images.unsplash.com/photo-1616348436168-de43ad0db179?w=300',
            'https://images.unsplash.com/photo-1585060544812-6b45742d762f?w=300'
        ];
        const names = ['Premium Product', 'Smart Device', 'Lifestyle Item', 'Essential Gear', 'Trendy Style', 'Value Pack'];

        let id = 1;
        for (let i = 0; i < 24; i++) {
            products.push({
                id: id++,
                title: names[i % names.length] + ' ' + (i + 1),
                price: Math.floor(Math.random() * 4500) + 299,
                category: categories[i % categories.length],
                img: images[i % images.length]
            });
        }

        // ============================================================
        // CART
        // ============================================================
        let cartItems = JSON.parse(localStorage.getItem('dealhub_cart') || '[]');

        function addToCart(id) {
            const user = localStorage.getItem('dealhub_user');
            if (!user) {
                alert('Please login first!');
                showPage('account-page');
                return;
            }
            const item = products.find(p => p.id === id);
            if (item) {
                cartItems.push(item);
                localStorage.setItem('dealhub_cart', JSON.stringify(cartItems));
                updateCartUI();
                showToast('🛒 ' + item.title + ' added!');
            }
        }

        function removeFromCart(index) {
            cartItems.splice(index, 1);
            localStorage.setItem('dealhub_cart', JSON.stringify(cartItems));
            updateCartUI();
        }

        function updateCartUI() {
            document.getElementById('cart-count').innerText = cartItems.length;
            const list = document.getElementById('cart-items-list');
            if (cartItems.length === 0) {
                list.innerHTML = '<p style="color:#888;">Cart is empty.</p>';
                document.getElementById('cart-total').innerText = 'Rs. 0';
                return;
            }
            list.innerHTML = '';
            let total = 0;
            cartItems.forEach((item, idx) => {
                total += item.price;
                list.innerHTML += `
                    <div class="cart-item">
                        <div>${item.title}</div>
                        <div>
                            Rs. ${item.price}
                            <i class="fa-solid fa-trash cart-item-remove" onclick="removeFromCart(${idx})"></i>
                        </div>
                    </div>
                `;
            });
            document.getElementById('cart-total').innerText = 'Rs. ' + total;
        }

        function checkout() {
            if (cartItems.length === 0) {
                alert('Cart is empty!');
                return;
            }
            alert('✅ Order placed successfully!');
            cartItems = [];
            localStorage.setItem('dealhub_cart', JSON.stringify(cartItems));
            updateCartUI();
            showPage('home-page');
        }

        // ============================================================
        // LOGIN
        // ============================================================
        function login() {
            const name = prompt('Enter your name:');
            if (name && name.trim()) {
                localStorage.setItem('dealhub_user', JSON.stringify({ name: name.trim() }));
                updateUserUI();
                showToast('👋 Welcome ' + name.trim() + '!');
            }
        }

        function logout() {
            localStorage.removeItem('dealhub_user');
            updateUserUI();
            showToast('Logged out successfully');
        }

        function updateUserUI() {
            const user = JSON.parse(localStorage.getItem('dealhub_user') || 'null');
            const avatar = document.getElementById('user-avatar-letter');
            const text = document.getElementById('header-user-text');
            const logoutBtn = document.getElementById('logout-btn');

            if (user) {
                avatar.textContent = user.name.charAt(0).toUpperCase();
                text.textContent = user.name;
                logoutBtn.style.display = 'inline-block';
            } else {
                avatar.textContent = '👤';
                text.textContent = 'Login';
                logoutBtn.style.display = 'none';
            }
        }

        // ============================================================
        // PWA INSTALL - FIXED FOR MOBILE
        // ============================================================
        let deferredPrompt = null;
        let isAppInstalled = false;

        // Check if already installed
        if (window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true) {
            isAppInstalled = true;
        }

        // Listen for install prompt
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            showInstallButtons();
        });

        // Listen for app installed
        window.addEventListener('appinstalled', () => {
            isAppInstalled = true;
            hideAllInstallButtons();
            showToast('✅ DealHub installed successfully!');
        });

        function showInstallButtons() {
            if (isAppInstalled) return;
            document.getElementById('pwa-header-btn').classList.add('show');
            document.getElementById('pwa-header-btn-alt').classList.add('show');
            document.getElementById('pwa-fab').classList.add('show');
            document.getElementById('install-banner-home').classList.add('show');
        }

        function hideAllInstallButtons() {
            document.getElementById('pwa-header-btn').classList.remove('show');
            document.getElementById('pwa-header-btn-alt').classList.remove('show');
            document.getElementById('pwa-fab').classList.remove('show');
            document.getElementById('install-banner-home').classList.remove('show');
        }

        function installPWA() {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                deferredPrompt.userChoice.then((result) => {
                    if (result.outcome === 'accepted') {
                        console.log('User accepted install');
                    } else {
                        console.log('User dismissed install');
                        showToast('📱 Open Chrome menu → "Add to Home Screen"');
                    }
                    deferredPrompt = null;
                });
            } else {
                // Fallback for browsers that don't support beforeinstallprompt
                showToast('📱 Open Chrome menu → "Add to Home Screen"');
                // Try native install if available
                if (navigator.install && typeof navigator.install === 'function') {
                    navigator.install();
                }
            }
        }

        // ============================================================
        // SERVICE WORKER - Inline registration
        // ============================================================
        if ('serviceWorker' in navigator) {
            // Create a simple inline service worker
            const swCode = `
                self.addEventListener('install', e => {
                    e.waitUntil(self.skipWaiting());
                });
                self.addEventListener('activate', e => {
                    e.waitUntil(self.clients.claim());
                });
                self.addEventListener('fetch', e => {
                    e.respondWith(fetch(e.request).catch(() => {
                        return new Response('Offline', { status: 503 });
                    }));
                });
            `;
            
            // Try to register a service worker from a blob URL
            try {
                const blob = new Blob([swCode], { type: 'application/javascript' });
                const swUrl = URL.createObjectURL(blob);
                navigator.serviceWorker.register(swUrl)
                    .then(() => console.log('SW registered!'))
                    .catch(err => console.log('SW registration failed:', err));
            } catch (e) {
                console.log('SW registration skipped:', e);
            }
        }

        // ============================================================
        // UI FUNCTIONS
        // ============================================================
        function showToast(message) {
            const existing = document.querySelector('.welcome-toast');
            if (existing) existing.remove();
            const toast = document.createElement('div');
            toast.className = 'welcome-toast';
            toast.innerHTML = message;
            document.body.appendChild(toast);
            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transition = 'opacity 0.5s';
                setTimeout(() => toast.remove(), 500);
            }, 4000);
        }

        function renderProducts() {
            const container = document.getElementById('home-products-container');
            container.innerHTML = '';
            products.slice(0, 18).forEach(product => {
                container.innerHTML += `
                    <div class="product-card">
                        <div>
                            <img src="${product.img}" class="product-img" onerror="this.src='data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%22300%22 height=%22300%22%3E%3Crect width=%22300%22 height=%22300%22 fill=%22%23f0f0f0%22/%3E%3Ctext x=%22150%22 y=%22150%22 text-anchor=%22middle%22 dy=%22.3em%22 fill=%22%23999%22 font-size=%2220%22%3E${product.title}%3C/text%3E%3C/svg%3E'">
                            <div class="product-info">
                                <div class="product-title">${product.title}</div>
                                <div class="product-price">Rs. ${product.price}</div>
                            </div>
                        </div>
                        <button class="add-btn" onclick="addToCart(${product.id})">Add To Cart</button>
                    </div>
                `;
            });
        }

        function showPage(pageId) {
            document.querySelectorAll('.page-view').forEach(p => p.classList.remove('active'));
            document.querySelectorAll('.mobile-nav-item').forEach(n => n.classList.remove('active'));
            document.getElementById(pageId).classList.add('active');
            if (pageId === 'home-page') document.getElementById('nav-home').classList.add('active');
            if (pageId === 'cart-page') document.getElementById('nav-cart').classList.add('active');
            if (pageId === 'account-page') document.getElementById('nav-account').classList.add('active');
            window.scrollTo(0, 0);
        }

        function handleSearch(e) {
            if (e.key === 'Enter') triggerSearch();
        }

        function triggerSearch() {
            const query = document.getElementById('search-input').value.toLowerCase().trim();
            if (!query) return;
            const filtered = products.filter(p => p.title.toLowerCase().includes(query));
            const container = document.getElementById('home-products-container');
            container.innerHTML = '';
            if (filtered.length === 0) {
                container.innerHTML = '<p style="color:#888;padding:20px;">No products found.</p>';
            } else {
                filtered.forEach(product => {
                    container.innerHTML += `
                        <div class="product-card">
                            <div>
                                <img src="${product.img}" class="product-img" onerror="this.src='data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%22300%22 height=%22300%22%3E%3Crect width=%22300%22 height=%22300%22 fill=%22%23f0f0f0%22/%3E%3Ctext x=%22150%22 y=%22150%22 text-anchor=%22middle%22 dy=%22.3em%22 fill=%22%23999%22 font-size=%2220%22%3E${product.title}%3C/text%3E%3C/svg%3E'">
                                <div class="product-info">
                                    <div class="product-title">${product.title}</div>
                                    <div class="product-price">Rs. ${product.price}</div>
                                </div>
                            </div>
                            <button class="add-btn" onclick="addToCart(${product.id})">Add To Cart</button>
                        </div>
                    `;
                });
            }
            showPage('home-page');
        }

        // ============================================================
        // INIT
        // ============================================================
        renderProducts();
        updateCartUI();
        updateUserUI();

        // Auto-show install buttons after 2 seconds (if not already shown)
        setTimeout(() => {
            if (!isAppInstalled && !deferredPrompt) {
                // For browsers that don't fire beforeinstallprompt, show fallback
                showInstallButtons();
                // Also show a gentle reminder
                if (!document.querySelector('.welcome-toast')) {
                    showToast('📱 Tap "Install App" to add DealHub to home screen');
                }
            }
        }, 3000);

        console.log('✅ DealHub PWA loaded successfully!');
        console.log('📱 To install: Look for "Install App" button in header');
        console.log('🔄 If button not visible, open Chrome menu → "Add to Home Screen"');
    </script>
</body>
</html>
